name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build all packages
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Build dashboard
        run: npm run build:dashboard -w @dbcanvas/desktop
        working-directory: packages/desktop/dashboard

      - name: Verify MCP server starts
        run: timeout 5 node packages/mcp-server/build/index.js 2>&1 || true
        shell: bash
