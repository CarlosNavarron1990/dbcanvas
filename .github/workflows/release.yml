name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-desktop:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build all packages
        run: npm run build

      - name: Bundle MCP server
        run: npm run bundle -w @dbcanvas/mcp-server

      - name: Build dashboard
        working-directory: packages/desktop/dashboard
        run: npm install --no-audit --no-fund && npm run build

      - name: Build Electron (${{ matrix.target }})
        working-directory: packages/desktop
        run: npx electron-builder --${{ matrix.target }} --publish always --config.npmRebuild=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_HARD_LINKS: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "true"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbcanvas-${{ matrix.target }}
          path: packages/desktop/release/*
          if-no-files-found: warn
