name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build all packages
        run: npm run build

      - name: Build dashboard
        working-directory: packages/desktop/dashboard
        run: npm run build

      - name: Build Electron (${{ matrix.target }})
        working-directory: packages/desktop
        run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbcanvas-${{ matrix.target }}
          path: packages/desktop/release/*
          if-no-files-found: warn
