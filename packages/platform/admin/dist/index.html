<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBCanvas Admin</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #0f172a; --card: #1e293b; --border: #334155; --accent: #6366f1; --text: #e2e8f0; --muted: #94a3b8; --green: #10b981; --red: #ef4444; }
body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.app { display: flex; min-height: 100vh; }
.sidebar { width: 220px; background: #0b1120; border-right: 1px solid var(--border); padding: 20px 0; }
.sidebar h1 { padding: 0 20px 20px; font-size: 18px; color: var(--accent); border-bottom: 1px solid var(--border); }
.nav-item { padding: 10px 20px; cursor: pointer; font-size: 13px; color: var(--muted); transition: all .15s; }
.nav-item:hover, .nav-item.active { background: rgba(99,102,241,.1); color: var(--accent); }
.main { flex: 1; padding: 30px; overflow-y: auto; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 30px; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.stat-value { font-size: 32px; font-weight: 800; color: white; }
.stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 8px; overflow: hidden; }
th { text-align: left; padding: 12px 16px; background: #0b1120; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
td { padding: 12px 16px; border-top: 1px solid var(--border); font-size: 13px; }
.badge { padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; }
.badge-free { background: rgba(148,163,184,.15); color: var(--muted); }
.badge-pro { background: rgba(99,102,241,.15); color: var(--accent); }
.badge-team { background: rgba(16,185,129,.15); color: var(--green); }
.badge-enterprise { background: rgba(245,158,11,.15); color: #f59e0b; }
.badge-active { background: rgba(16,185,129,.15); color: var(--green); }
.badge-cancelled { background: rgba(239,68,68,.15); color: var(--red); }
.login-box { max-width: 360px; margin: 15vh auto; background: var(--card); padding: 40px; border-radius: 12px; border: 1px solid var(--border); }
.login-box h2 { margin-bottom: 20px; }
.login-box input { width: 100%; padding: 10px; margin-bottom: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 14px; }
.login-box button, .btn { padding: 10px 20px; background: var(--accent); border: none; border-radius: 6px; color: white; font-weight: 700; cursor: pointer; font-size: 13px; }
.btn:hover { filter: brightness(1.15); }
.section-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
#app { min-height: 100vh; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = '';
let token = localStorage.getItem('dbc_token');
let currentView = 'dashboard';

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) };
  const res = await fetch(API + path, { ...opts, headers: { ...headers, ...opts.headers } });
  return res.json();
}

async function login(email, password) {
  const data = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
  if (data.token) { token = data.token; localStorage.setItem('dbc_token', token); render(); }
  else alert(data.error || 'Login failed');
}

function logout() { token = null; localStorage.removeItem('dbc_token'); render(); }

function renderLogin() {
  return `<div class="login-box">
    <h2>DBCanvas Admin</h2>
    <input id="email" placeholder="Email" value="admin@dbcanvas.dev">
    <input id="pass" type="password" placeholder="Password" value="admin123">
    <button onclick="login(document.getElementById('email').value, document.getElementById('pass').value)">Login</button>
  </div>`;
}

async function renderDashboard() {
  const stats = await api('/api/admin/stats');
  const users = await api('/api/admin/users');
  const licenses = await api('/api/license/all');
  return `<div class="app">
    <div class="sidebar">
      <h1>DBCanvas</h1>
      <div class="nav-item active" onclick="currentView='dashboard';render()">Dashboard</div>
      <div class="nav-item" onclick="currentView='users';render()">Users</div>
      <div class="nav-item" onclick="currentView='licenses';render()">Licenses</div>
      <div class="nav-item" onclick="currentView='usage';render()">Usage</div>
      <div class="nav-item" onclick="currentView='conversion';render()">Conversion</div>
      <div class="nav-item" onclick="logout()">Logout</div>
    </div>
    <div class="main">
      ${currentView === 'dashboard' ? renderStats(stats) : ''}
      ${currentView === 'users' ? renderUsers(users) : ''}
      ${currentView === 'licenses' ? renderLicenses(licenses) : ''}
      ${currentView === 'usage' ? await renderUsage() : ''}
      ${currentView === 'conversion' ? await renderConversion() : ''}
    </div>
  </div>`;
}

function renderStats(s) {
  return `<h2 class="section-title">Dashboard</h2>
  <div class="stats">
    <div class="stat-card"><div class="stat-value">${s.users.total}</div><div class="stat-label">Total Users</div></div>
    <div class="stat-card"><div class="stat-value">${s.licenses.pro}</div><div class="stat-label">Pro Licenses</div></div>
    <div class="stat-card"><div class="stat-value">${s.licenses.team}</div><div class="stat-label">Team Licenses</div></div>
    <div class="stat-card"><div class="stat-value">$${s.revenue.thisMonth.toFixed(2)}</div><div class="stat-label">Revenue (Month)</div></div>
    <div class="stat-card"><div class="stat-value">$${s.revenue.total.toFixed(2)}</div><div class="stat-label">Revenue (Total)</div></div>
    <div class="stat-card"><div class="stat-value">${s.usage.today}</div><div class="stat-label">API Calls Today</div></div>
  </div>
  <h3 style="margin:20px 0 10px">Top Tools (30d)</h3>
  <table><thead><tr><th>Tool</th><th>Count</th></tr></thead><tbody>
  ${s.usage.topTools.map(t => `<tr><td>${t.tool_name}</td><td>${t.count}</td></tr>`).join('')}
  </tbody></table>`;
}

function renderUsers(users) {
  return `<h2 class="section-title">Users (${users.length})</h2>
  <table><thead><tr><th>Email</th><th>Name</th><th>Tier</th><th>Status</th><th>Joined</th></tr></thead><tbody>
  ${users.map(u => `<tr>
    <td>${u.email}</td><td>${u.name||'-'}</td>
    <td><span class="badge badge-${u.tier||'free'}">${(u.tier||'free').toUpperCase()}</span></td>
    <td><span class="badge badge-${u.license_status||'active'}">${(u.license_status||'none').toUpperCase()}</span></td>
    <td>${u.created_at?.substring(0,10)||'-'}</td>
  </tr>`).join('')}
  </tbody></table>`;
}

function renderLicenses(licenses) {
  return `<h2 class="section-title">Licenses (${licenses.length})</h2>
  <table><thead><tr><th>Key</th><th>User</th><th>Tier</th><th>Status</th><th>Machines</th><th>Created</th></tr></thead><tbody>
  ${licenses.map(l => `<tr>
    <td style="font-family:monospace;font-size:11px">${l.license_key}</td>
    <td>${l.email}</td>
    <td><span class="badge badge-${l.tier}">${l.tier.toUpperCase()}</span></td>
    <td><span class="badge badge-${l.status}">${l.status.toUpperCase()}</span></td>
    <td>${l.active_machines}</td>
    <td>${l.created_at?.substring(0,10)||'-'}</td>
  </tr>`).join('')}
  </tbody></table>`;
}

async function renderUsage() {
  const data = await api('/api/admin/usage?days=30');
  return `<h2 class="section-title">Usage (30 days)</h2>
  <div class="stats">
    <div class="stat-card"><div class="stat-value">${data.daily.reduce((s,d)=>s+d.count,0)}</div><div class="stat-label">Total Calls</div></div>
  </div>
  <h3 style="margin:20px 0 10px">By Tool</h3>
  <table><thead><tr><th>Tool</th><th>Calls</th></tr></thead><tbody>
  ${data.byTool.map(t => `<tr><td>${t.tool_name}</td><td>${t.count}</td></tr>`).join('')}
  </tbody></table>
  <h3 style="margin:20px 0 10px">By Tier</h3>
  <table><thead><tr><th>Tier</th><th>Calls</th></tr></thead><tbody>
  ${data.byLicense.map(t => `<tr><td><span class="badge badge-${t.tier||'free'}">${(t.tier||'FREE').toUpperCase()}</span></td><td>${t.count}</td></tr>`).join('')}
  </tbody></table>`;
}

async function render() {
  const el = document.getElementById('app');
  if (!token) { el.innerHTML = renderLogin(); return; }
  try { el.innerHTML = await renderDashboard(); }
  catch(e) { console.error(e); el.innerHTML = renderLogin(); }
}

async function renderConversion() {
  const data = await api('/api/admin/conversion');
  const f = data.funnel, r = data.rates, rev = data.revenue, g = data.growth;
  return `<h2 class="section-title">Conversion Funnel</h2>
  <div class="stats">
    <div class="stat-card"><div class="stat-value">${f.registered}</div><div class="stat-label">Registered</div></div>
    <div class="stat-card"><div class="stat-value">${f.trial}</div><div class="stat-label">Started Trial</div></div>
    <div class="stat-card"><div class="stat-value">${f.totalPaid}</div><div class="stat-label">Paid</div></div>
    <div class="stat-card"><div class="stat-value">${f.cancelled}</div><div class="stat-label">Cancelled</div></div>
  </div>
  <h3 style="margin:20px 0 10px">Rates</h3>
  <div class="stats">
    <div class="stat-card"><div class="stat-value">${r.trialToPaid}</div><div class="stat-label">Trial to Paid</div></div>
    <div class="stat-card"><div class="stat-value">${r.churn}</div><div class="stat-label">Churn Rate</div></div>
  </div>
  <h3 style="margin:20px 0 10px">Revenue</h3>
  <div class="stats">
    <div class="stat-card"><div class="stat-value">$${rev.mrr}/mo</div><div class="stat-label">MRR</div></div>
    <div class="stat-card"><div class="stat-value">$${rev.estimatedLtv}</div><div class="stat-label">Est. LTV</div></div>
  </div>
  <h3 style="margin:20px 0 10px">Growth</h3>
  <div class="stats">
    <div class="stat-card"><div class="stat-value">${g.regsLast7}</div><div class="stat-label">Signups 7d</div></div>
    <div class="stat-card"><div class="stat-value">${g.regsLast30}</div><div class="stat-label">Signups 30d</div></div>
  </div>`;
}

render();
</script>
</body>
</html>
